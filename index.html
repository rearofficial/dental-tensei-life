<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歯科転生ライフ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap">
<style>
:root{--bg:#e8f5f1;--card:#fff;--ink:#12263a;--sub:#4a6075;--acc:#1f8a8a;--gold:#f0b43c;--bad:#d4574e;--soft:#d3ebe5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c2a;--card:#182a3d;--ink:#e8f1f7;--sub:#9fb4c6;--acc:#4cc2b8;--gold:#f3c969;--soft:#22384d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c2a;--card:#182a3d;--ink:#e8f1f7;--sub:#9fb4c6;--acc:#4cc2b8;--soft:#22384d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;line-height:1.8;font-size:16px}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(30px,8vw,44px);font-weight:900;line-height:1.25;margin:8px 0 12px;letter-spacing:.02em}
.sub{color:var(--sub);margin:0 0 16px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.age{font-weight:900;font-size:22px;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 16px;white-space:nowrap}
.bar{flex:1;height:10px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
.board{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px 12px 10px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.t{aspect-ratio:4/5;background:#fff;border:2px solid var(--ink);border-radius:45% 45% 55% 55%;transition:all .6s}
.cnt{display:flex;justify-content:space-between;font-weight:700;margin-top:8px;font-size:15px}
.win{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px 18px 20px;box-shadow:0 6px 0 var(--ink)}
.win p{margin:0 0 12px}
.who{font-weight:900;color:var(--acc)}
.ch{display:block;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer;transition:transform .12s,background .12s}
.ch:hover{transform:translateY(-2px);background:var(--soft)}
.ch:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.go{font:inherit;font-weight:900;font-size:17px;color:var(--bg);background:var(--ink);border:0;border-radius:999px;padding:12px 28px;cursor:pointer;margin-top:8px}
.go.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.memo{background:var(--soft);border-left:6px solid var(--acc);border-radius:10px;padding:10px 14px;margin:12px 0}
.memo b{color:var(--acc)}
.up{color:var(--acc);font-weight:900}.down{color:var(--bad);font-weight:900}
.big{font-size:clamp(44px,14vw,72px);font-weight:900;line-height:1.1;margin:4px 0}
.tips{padding-left:20px;margin:8px 0}
.note{font-size:13px;color:var(--sub)}
.t.x,.t.fall{background:transparent;border:2px dashed var(--sub);opacity:.35;transform:scale(.8)}
.t.fall{animation:fall .9s ease-in both}
@keyframes fall{0%{transform:none;opacity:1;background:#fff;border:2px solid var(--ink)}30%{transform:translateY(-4px) rotate(-14deg);background:var(--bad);opacity:1;border:2px solid var(--ink)}100%{transform:translateY(10px) scale(.8);opacity:.35;background:transparent;border:2px dashed var(--sub)}}
.t.shine{animation:shine .8s ease both}
@keyframes shine{0%,100%{transform:none;box-shadow:none}40%{transform:translateY(-4px) scale(1.12);box-shadow:0 0 12px 3px var(--gold)}}
.win{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.win.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.bob{font-size:56px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.bob,.win,.win.shake{animation:none!important}}
</style></head>
<body><main id="app"></main>
<script>
var S=[
{a:0,s:"生後6か月。最初の歯が顔を出した。家族があなたのお世話の仕方を考えている…",c:[
["寝る前の授乳のあと、湿らせたガーゼで歯をぬぐってから寝かせる",-2,"歯が生えたら、寝る前に口の中をぬぐう習慣が役立ちます。"],
["夜泣きのたびに、少し甘い飲み物で落ち着かせる",2,"寝ている間は唾液が減るので、甘い飲み物は歯に長く触れ、むし歯の原因になります。"],
["歯ブラシは1歳を過ぎるまで控える",1,"歯ブラシは歯が生えたときから使えます。やわらかいブラシで少しずつ慣らしましょう。"],
["お風呂で、歯ブラシをなめさせる程度にしておく",0,"慣れさせるのは大切ですが、それだけでは汚れは落ちません。大人の仕上げ磨きを習慣に。"]]},
{a:3,s:"3歳。乳歯20本がそろった。おやつの時間をどうするか、家族の作戦会議。",c:[
["おやつは1日1回、決まった時間に。飲み物は水かお茶",-2,"むし歯は食べる回数や時間が大きく関わります。回数を絞り、水かお茶で終えるのが基本です。"],
["小分けのお菓子を、遊びながら少しずつつまませる",3,"少しずつ長くつまむと、口の中が酸性の時間が続き、歯が溶けやすくなります。"],
["おやつは果物とヨーグルトにして、時間は自由にする",1,"果物やヨーグルトにも糖や酸が含まれます。体にいい食べ物でも、時間と回数は決めた方が安心です。"],
["お菓子はやめて、毎日100%果汁ジュースだけ許す",2,"100%果汁でも糖と酸を含みます。毎日飲む習慣は、歯への負担になります。"]]},
{a:6,s:"6歳。奥に初めての永久歯『6歳臼歯』が生えてきた。乳歯もまだ残っている。",c:[
["フッ素入り歯みがき粉を使い、仕上げ磨きは奥歯の溝を重点的に",-2,"フッ素は歯を強くして再石灰化を助けます。奥歯の溝は磨き残しが出やすいので、大人の仕上げが効果的です。"],
["歯科でシーラントを相談しつつ、家では自分で磨かせる",-1,"シーラントは溝を埋める予防処置です。家庭の歯みがきと併用してこそ効果が出ます。"],
["乳歯は生え変わるので、むし歯になっても大丈夫と考える",3,"6歳臼歯は一生使う永久歯です。乳歯のむし歯は、あとから生える永久歯にも影響することがあります。"],
["歯みがき粉は使わず、ブラシで時間をかけてていねいに磨く",0,"時間をかけて磨くのはいいことですが、フッ素入りの歯みがき粉を使わないと、歯を強くする力が弱まります。"]]},
{a:12,s:"12歳。部活の毎日。永久歯はほぼ生えそろった。のどがかわく季節がやってくる。",c:[
["基本は水かお茶。甘い飲み物は時間を決めて飲み、帰宅後に磨く",-1,"甘い飲み物は『ちびちび』より『時間を決めて』が基本です。ふだんの水分は水かお茶で。"],
["練習中、スポーツドリンクを少しずつ飲む",2,"糖や酸を含む飲み物を少しずつ飲み続けると、歯が酸にさらされる時間が長くなります。"],
["毛先の硬いブラシで、力を入れてしっかり磨く",1,"強い力で磨くと歯ぐきや歯の表面を傷めます。軽い力で小さく動かすのがコツです。"],
["冷たい物で歯がしみるが、部活が忙しいので様子を見る",2,"しみる症状は、むし歯や知覚過敏のサインのことも。早めに診てもらう方が治療も軽く済みます。"]]},
{a:18,s:"18歳。ひとり暮らしが始まった。夜ふかしの毎日、親知らずの気配も…",c:[
["毎晩磨く。歯みがき粉はたっぷりつけ、水で何度もすすぐ",1,"すすぎすぎると歯みがき粉のフッ素が流れてしまいます。少量の水で1回程度のすすぎがおすすめです。"],
["眠い日は、マウスウォッシュで済ませる",1,"マウスウォッシュは補助役です。歯の汚れは、ブラシなどで物理的に落とすのが基本です。"],
["朝晩磨き、歯の間はフロスで掃除する",-2,"歯と歯の間は、歯ブラシだけでは汚れが残りがち。フロスや歯間ブラシが予防の味方です。"],
["夜は磨けない日が多いが、朝にしっかり磨く",2,"寝ている間は唾液が減って細菌が増えやすいので、夜のケアは特に重要です。"]]},
{a:30,s:"30歳。仕事が忙しい。歯科の予約は後回しになりがちだ。",c:[
["気になる症状が出てから、歯科に行く",2,"症状が出る頃には進行していることも。痛みがなくても、定期的にチェックする方が歯を残せます。"],
["年に2回、歯科で検診とクリーニングを受ける",-2,"検診とクリーニングで、早期発見と、自分では取れない歯石の除去ができます。"],
["電動歯ブラシを買ったので、検診は行かなくていいと考える",1,"電動歯ブラシは便利ですが、磨き残しや歯周病の進み具合は検診で確認する必要があります。"],
["ホワイトニング歯みがき粉で、見た目をしっかりケアする",0,"見た目のケアが中心です。むし歯や歯周病の予防は、別に考える必要があります。"]]},
{a:45,s:"45歳。歯みがきのとき、ブラシに血がつくようになった。",c:[
["出血は磨きすぎが原因と考え、しばらく磨くのを控える",3,"磨かないと汚れ（プラーク）が残り、歯ぐきの炎症は悪化します。出血があっても、やさしく丁寧に磨くのが大切です。"],
["歯科で歯周病の検査を受け、歯石の除去と磨き方の指導を受ける",-2,"歯周病は痛みなく進みます。早く見つければ進行を抑えられます。"],
["歯ぐきを引き締めたくて、毛先の硬いブラシで強く磨く",1,"強く磨くと、歯ぐきが下がったり歯がすり減ったりします。毛先はやわらかめがおすすめです。"],
["殺菌成分入りの歯みがき粉に変えて、様子を見る",0,"補助にはなりますが、歯石や深い部分の炎症は、歯科でのケアが必要です。"]]},
{a:60,s:function(){return st.lost>0?"60歳。むし歯や歯周病で、奥歯を失った。まだ他の歯で噛めている。":"60歳。奥歯の1本がぐらぐらして、歯ぐきがやせてきた。"},c:[
["他の歯で噛めるので、痛みが出るまで様子を見る",2,"そのままにすると、隣の歯が傾いて噛み合わせが崩れ、ほかの歯にも負担が広がります。"],
["歯科で原因を調べ、治療の選択肢を相談する",-1,"原因を調べたうえで、入れ歯・ブリッジ・インプラントなど、選択肢を相談できます。"],
["やわらかい食事に切り替えて、歯への負担を減らす",1,"噛まない生活は、あごや噛む力を弱めます。噛める状態を整えることが大切です。"],
["ネットで調べた歯みがき剤で、自分で治そうとする",2,"ぐらつきの多くは歯周病や噛み合わせが原因です。自己判断では治らないので、歯科で原因を調べましょう。"]]},
{a:75,s:"75歳。口がかわきやすくなり、ひとりで磨くのが少し大変になってきた。",c:[
["かかりつけ歯科で、定期的なケアと歯のチェックを受ける",-2,"年を重ねると唾液が減り、歯の根元もむし歯になりやすくなります。かかりつけ歯科は心強い味方です。"],
["毎食後は難しいので、夜だけは必ず磨く",-1,"夜のケアは特に大切です。余裕があれば、朝晩のケアが理想です。"],
["口のかわきは年のせいと考え、特に何もしない",2,"口のかわきは、むし歯や不快感の原因になります。水分補給や保湿、歯科での相談が役立ちます。"],
["磨くのがつらいので、強いミントのうがい薬で済ませる",1,"うがい薬だけでは歯の汚れは落ちません。歯や入れ歯は、ブラシで毎日の清掃を。"]]}
];
var F=[0,0,0,0,.4,1,1.5,2,2.6];
var G=[["エナメル質の加護","歯の表面がとても強い体質。むし歯になりにくい！",-2],["唾液の泉","唾液がたっぷり出る体質。お口の自浄作用が強い！",-1],["ふつうの歯","特別な力はないが、努力しだいで未来は変わる。",0],["歯並びの試練","歯並びが複雑で磨き残しが出やすい。ケアが腕の見せどころ。",2]];
var st,app=document.getElementById("app");
function shuf(a){a=a.slice();for(var i=a.length-1,j,t;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function rng(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a}
function board(){var h='<div class="grid">',k,p,c,d;for(k=0;k<32;k++){p=st.ord.indexOf(k);d='';c=p<st.pl?'x':p<st.lost?'fall':st.fx?'shine':'';if(c=='fall')d=' style="animation-delay:'+((p-st.pl)*.15+.2)+'s"';else if(c=='shine')d=' style="animation-delay:'+k*.04+'s"';h+='<i class="t '+c+'"'+d+'></i>'}return h+'</div><div class="cnt"><span>🦷 のこりの歯 '+(32-st.lost)+'本</span><span>目標：80歳で20本</span></div>'}
function hdr(){var a=S[st.i]?S[st.i].a:80;return '<div class="top"><span class="age">'+a+'歳</span><div class="bar"><i style="width:'+Math.min(100,a/80*100)+'%"></i></div></div><div class="board">'+board()+'</div>'}
function start(){st={i:0,r:0,lost:0,pl:0,fx:'',ord:shuf(rng(32))};app.innerHTML='<p class="sub">歯みがきの世界で、ひとつの人生を生きてみよう</p><div class="bob">🦷</div><h1>歯科転生ライフ</h1><div class="win"><p><span class="who">歯の女神</span>「目覚めなさい。あなたは新しい人生へ転生しました。」</p><p>あなたの目標は、<b>80歳になったとき、自分の歯を20本以上残す</b>こと（8020運動）。0歳から75歳まで、9つの場面で選択を重ねます。どれも一見もっともらしい選択ですが、正解は…？</p><button class="go" onclick="gift()">女神に会う</button></div><p class="note">楽しみながら歯の知識を学ぶゲームです。診断ではありません。</p>'}
function gift(){var g=G[Math.floor(Math.random()*G.length)];st.r=g[2];app.innerHTML='<div class="win"><p><span class="who">歯の女神</span>「転生の贈り物として、これを授けましょう。」</p><div class="big" style="font-size:28px">✨ '+g[0]+'</div><p>'+g[1]+'</p><button class="go" onclick="show()">転生する</button></div>'}
function show(){st.pl=st.lost;st.fx='';var s=S[st.i],h=hdr()+'<div class="win"><p>'+(typeof s.s=='function'?s.s():s.s)+'</p><p class="note">'+(st.i<3?'周りの大人の選択で、あなたの歯が決まっていきます。':'あなたの選択は？')+'</p>';shuf(rng(s.c.length)).forEach(function(k){h+='<button class="ch" onclick="pick('+k+')">'+s.c[k][0]+'</button>'});app.innerHTML=h+'</div>'}
function pick(k){var s=S[st.i],c=s.c[k],d=c[1],before=st.lost,l;st.r+=d;l=Math.min(32,Math.floor(Math.max(0,st.r)*F[st.i]));st.lost=Math.max(st.lost,l);st.pl=before;st.fx=d<0?'shine':'';var n=st.lost-before,tg=d<=-2?['up','ベストな選択！']:d==-1?['up','いい選択']:d==0?['','惜しい、あと一歩']:d==1?['down','少し危険な選択']:['down','歯にはかなり危険な選択'];
app.innerHTML=hdr()+'<div class="win'+(n>0?' shake':'')+'"><p><b>「'+c[0]+'」</b></p><p><span class="'+tg[0]+'">'+tg[1]+'</span>'+(n>0?' <span class="down">歯が'+n+'本、抜けてしまった…</span>':'')+'</p><div class="memo"><b>歯科メモ</b><br>'+c[2]+'</div><button class="go" onclick="next()">'+(st.i<S.length-1?'次の年代へ':'80歳を迎える')+'</button></div>'}
function next(){st.i++;st.i<S.length?show():end()}
function end(){var m=32-st.lost,t,d;if(m>=28){t="歯の賢者";d="80歳でほぼ全部の歯が健在。食事がおいしくて笑顔があふれる晩年です。"}else if(m>=20){t="8020達成！";d="目標クリア。自分の歯で、好きなものをおいしく食べられます。"}else if(m>=10){t="あと一歩の冒険者";d="あと少しで目標でした。今からでも、定期検診とケアで歯を守れます。"}else{t="歯科と歩む旅人";d="歯が少なくなっても、入れ歯やインプラントなど、噛める状態を取り戻す道があります。早めの相談がカギです。"}
st.i=9;st.pl=0;st.fx='';app.innerHTML='<div class="board">'+board()+'</div><div class="win"><p class="note">80歳の誕生日。あなたの結果は…</p><div class="big" id="cn">32本</div><p style="font-weight:900;font-size:22px;margin:0 0 8px">'+t+'</p><p>'+d+'</p><div class="memo"><b>現実の人生で、今日からできること</b><ul class="tips"><li>半年〜1年に一度、歯科で検診とクリーニング</li><li>フッ素入り歯みがき粉と、フロスや歯間ブラシ</li><li>歯ぐきの出血や、しみる感じは早めに相談</li></ul></div><button class="go" onclick="start()">もう一度転生する</button> <button class="go alt" onclick="cp()" id="cb">結果をコピー</button></div><p class="note">現実では転生できません。気になることがあれば、かかりつけの歯科医院へ。（このゲームは簡略化したもので、診断ではありません）</p>';
var e=document.getElementById("cn"),n=32,iv=setInterval(function(){if(n<=m){clearInterval(iv);return}n--;e.textContent=n+'本'},150);if(m==32)clearInterval(iv)}
function cp(){var x='歯科転生ライフで、80歳の時点で歯が'+(32-st.lost)+'本残りました！';try{navigator.clipboard.writeText(x).then(function(){document.getElementById("cb").textContent="コピーしました"})}catch(e){}}
start();
</script></body></html>
